version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  logpulse:
    build: .
    ports:
      - "3000:3000"
    environment:
      REDIS_HOST: redis
      LOGPULSE_API_KEYS: dev-key-change-me
    depends_on:
      redis:
        condition: service_healthy